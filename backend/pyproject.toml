[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", ".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length handled by formatter; keep readable wrapped code
    "B008",   # FastAPI uses default callables in args (Depends/Body)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"alembic/*" = ["E402", "F401"]
